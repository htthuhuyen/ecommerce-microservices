services:
  auth-service:
    image: prompt3-auth-service:latest
    env_file:
      - ./services/auth-service/.env
    environment:
      DB_HOST: auth-db
      DB_PORT: "5432"
      KAFKA_BROKER: kafka:9092
    ports:
      - "3001:3001"
      - "50051:50051"
    networks:
      - prompt3-network

  customer-service:
    image: prompt3-customer-service:latest
    env_file:
      - ./services/customer-service/.env
    environment:
      DB_HOST: customer-db
      DB_PORT: "5432"
      KAFKA_BROKER: kafka:9092
    ports:
      - "3002:3002"
      - "50052:50052"
    networks:
      - prompt3-network

  product-service:
    image: prompt3-product-service:latest
    env_file:
      - ./services/product-service/.env
    environment:
      MONGO_URI: mongodb://product-db:27017/product_db
    ports:
      - "3003:3003"
      - "50053:50053"
    networks:
      - prompt3-network

  order-service:
    image: prompt3-order-service:latest
    env_file:
      - ./services/order-service/.env
    environment:
      DB_HOST: order-db
      DB_PORT: "5432"
      PRODUCT_GRPC_URL: product-service:50053
      CUSTOMER_GRPC_URL: customer-service:50052
      SHIPMENT_GRPC_URL: shipment-service:50055
      KAFKA_BROKER: kafka:9092
    ports:
      - "3004:3004"
    depends_on:
      - product-service
      - shipment-service
    networks:
      - prompt3-network

  shipment-service:
    image: prompt3-shipment-service:latest
    env_file:
      - ./services/shipment-service/.env
    environment:
      DB_HOST: shipment-db
      DB_PORT: "5432"
      KAFKA_BROKER: kafka:9092
    ports:
      - "3005:3005"
      - "50055:50055"
    networks:
      - prompt3-network

  api-gateway:
    image: prompt3-api-gateway:latest
    env_file:
      - ./api-gateway/.env
    environment:
      AUTH_SERVICE_URL: http://auth-service:3001
      CUSTOMER_SERVICE_URL: http://customer-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      SHIPMENT_SERVICE_URL: http://shipment-service:3005
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - customer-service
      - product-service
      - order-service
      - shipment-service
    networks:
      - prompt3-network

  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    container_name: prompt3-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - prompt3-network

volumes:
  kafka_data:

networks:
  prompt3-network:
    external: true
    name: prompt3-network

